[project]
name = "job-recommendation-api"
version = "0.1.0"
description = "A no-auth FastAPI service that turns a resume PDF into actionable career guidance via markitdown + OpenRouter LLM."
readme = "README.md"
authors = [
    { name = "Amurru Zerouk", email = "me@amurru.dev" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pydantic-settings>=2.5",
    "markitdown[pdf]>=0.1.6",
    "openrouter>=0.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.9",
    "mypy>=1.14",
    "pre-commit>=4.0",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "httpx", "ruff", "mypy", "pre-commit"]

[project.scripts]
job-recommendation-api = "job_recommendation_api.main:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # bugbear
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.File", "fastapi.Query", "fastapi.Path", "fastapi.Body", "fastapi.Depends"]

[tool.ruff.lint.isort]
known-first-party = ["job_recommendation_api"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_return_any = false
check_untyped_defs = true
disallow_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
no_implicit_optional = true
no_implicit_reexport = true

[[tool.mypy.overrides]]
module = "openrouter.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "markitdown.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "uvicorn.*"
ignore_missing_imports = true

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"